<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SlotHub</title>
    <link rel="stylesheet" href="./style.css">
    <script type="module" src="./hub.mjs"></script>
  </head>
  <body>
    <main class="hub">
      <header>
        <h1>SlotHub</h1>
        <p>ゲームを選んで、クレジットで遊ぶ。</p>
      </header>
      <section aria-labelledby="game-heading">
        <h2 id="game-heading">ゲーム一覧</h2>
        <p id="catalog-status" role="status" hidden></p>
        <ul class="game-list" id="game-list"></ul>
        <noscript>ゲーム一覧の表示にはJavaScriptを有効にしてください。</noscript>
      </section>
    </main>
  </body>
</html>
