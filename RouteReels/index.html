<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Route Reels | SlotHub</title>
  <link rel="stylesheet" href="../shared/reels.css">
  <script type="module" src="./game.mjs"></script>
</head>
<body>
  <main>
    <a href="../">← SlotHubに戻る</a>
    <h1>Route Reels</h1>
    <p>左の列から始め、同じ図柄を右へつなげます。上下に1段ずれてもつなげます。</p>
    <p class="balance">クレジット <strong id="credits">100</strong> · 1回転 1クレジット</p>
    <div class="reels" aria-label="ルート用の盤面">
      <button type="button" class="reel" aria-pressed="false" disabled>—</button>
      <button type="button" class="reel" aria-pressed="false" disabled>—</button>
      <button type="button" class="reel" aria-pressed="false" disabled>—</button>
      <button type="button" class="reel" aria-pressed="false" disabled>—</button>
      <button type="button" class="reel" aria-pressed="false" disabled>—</button>
      <button type="button" class="reel" aria-pressed="false" disabled>—</button>
      <button type="button" class="reel" aria-pressed="false" disabled>—</button>
      <button type="button" class="reel" aria-pressed="false" disabled>—</button>
      <button type="button" class="reel" aria-pressed="false" disabled>—</button>
    </div>
    <div class="actions">
      <button type="button" id="spin" class="primary">回す</button>
      <button type="button" id="undo" disabled>選び直す</button>
      <button type="button" id="collect" disabled>このルートで確定</button>
      <button type="button" id="reset">最初から</button>
    </div>
    <p class="status" id="status" role="status">回すボタンで開始します。</p>
    <details>
      <summary>ルールと配当</summary>
      <p id="payout-table"></p>
      <p>確定前は何度でも選び直せます。</p>
    </details>
  </main>
</body>
</html>
